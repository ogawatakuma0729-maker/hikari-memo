{% extends "base.html" %}
{% block title %}ひかりメモ｜申し込み見本{% endblock %}
{% block body %}
<section class="hero">
  <h1>一言メモを残す</h1>
  <p>フォームの内容が、サーバー側に保存されて一覧に出ます。Pythonの裏側の見本です。</p>
</section>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('submit') }}">
  <label for="name">名前（仮でよい）</label>
  <input id="name" name="name" maxlength="40" required>
  <label for="body">内容</label>
  <textarea id="body" name="body" rows="5" maxlength="400" required></textarea>
  <button type="submit">残す</button>
</form>
<p class="note"><a href="{{ url_for('notes') }}">いま残っている一覧を見る</a></p>
{% endblock %}
